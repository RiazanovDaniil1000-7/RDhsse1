server:
  port: 8081

app:
  name: "ToDo-Manager-MVP"
  version: "1.0.0-SNAPSHOT"
  description: "Spring Boot Homework Application"
  api:
    version: "2.0.0"
  upload:
    dir: uploads
  debug: true

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
      file-size-threshold: 2KB
  # УБЕРИТЕ эти настройки, если они есть:
  # mvc:
  #   throw-exception-if-no-handler-found: true
  # web:
  #   resources:
  #     add-mappings: false

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
    com.example: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    com.example: ERROR

app:
  debug: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB